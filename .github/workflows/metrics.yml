name: Generate profile metrics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Africa/Kigali
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8

      - name: 3D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Africa/Kigali
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Language breakdown
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Africa/Kigali
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_ignored: html, css, batchfile, blade, shell
          plugin_languages_sections: most-used
